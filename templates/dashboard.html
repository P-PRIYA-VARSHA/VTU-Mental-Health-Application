<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dashboard</title>
  <style>
    /* Dashboard Styling */
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%);
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .profile-section, .mood-summary {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-section:hover, .mood-summary:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.15);
    }

    .profile-section {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-left: 5px solid #4CAF50;
    }

    .mood-summary {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-left: 5px solid #2196F3;
    }

    .dashboard-header {
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
      margin: 10px 0;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e1e5ea;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
      outline: none;
    }

    .btn-update {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }

    .btn-update:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }

    /* Overall Dashboard Page styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <h2>Welcome to Your Dashboard</h2>
    <p>Track your mood and manage your mental wellness journey</p>
  </div>
  <div class="dashboard-container">
    <div class="profile-section">
      <h3>Profile Information</h3>
      <form id="profileForm">
        <div class="form-group">
          <label for="dashboardName">Full Name</label>
          <input type="text" id="dashboardName" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="dashboardAge">Age</label>
          <input type="number" id="dashboardAge" min="1" max="120" required placeholder="Enter your age">
        </div>
        <div class="form-group">
          <label for="dashboardGender">Gender</label>
          <select id="dashboardGender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="prefer-not-say">Prefer not to say</option>
          </select>
        </div>
        <button type="submit" class="btn-update">Update Profile</button>
      </form>
    </div>
    <div class="mood-summary">
      <h3>Mood Summary</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalMoodLogs">0</div>
          <div class="stat-label">Total Mood Logs</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="averageMood">-</div>
          <div class="stat-label">Average Mood</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="frequentMood">-</div>
          <div class="stat-label">Most Frequent Mood</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="streakCount">0</div>
          <div class="stat-label">Day Streak</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simulated data for demonstration
    const db = {
      moods: [
        { userId: 1, timestamp: new Date("2023-02-20T10:00:00").getTime() },
        { userId: 1, timestamp: new Date("2023-02-21T09:00:00").getTime() },
        { userId: 1, timestamp: new Date("2023-02-22T08:00:00").getTime() }
        // Add more sample mood entries as needed...
      ]
    };

    const currentUser = { id: 1 };

    function calculateStreak() {
      const userMoods = db.moods.filter(m => m.userId === currentUser.id);
      if (userMoods.length === 0) return 0;
      userMoods.sort((a, b) => b.timestamp - a.timestamp);
      let streak = 1;
      for (let i = 1; i < userMoods.length; i++) {
        const currentDay = new Date(userMoods[i].timestamp).setHours(0, 0, 0, 0);
        const prevDay = new Date(userMoods[i - 1].timestamp).setHours(0, 0, 0, 0);
        if ((prevDay - currentDay) === 86400000) { // 1 day in milliseconds
          streak++;
        } else {
          break;
        }
      }
      return streak;
    }

    function updateMoodStats() {
      document.getElementById('streakCount').textContent = calculateStreak();
      // Additional stats update logic can be added here
    }

    // Call updateMoodStats on page load for demonstration purposes
    updateMoodStats();
  </script>
</body>
</html>
