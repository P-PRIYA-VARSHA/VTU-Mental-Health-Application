{% extends "base.html" %}
{% block content %}
  <h2>Daily Planning & Blog</h2>
  <div class="button-group">
    <a href="{{ url_for('newpost') }}"><button>Create New Post</button></a>
    <a href="{{ url_for('index') }}"><button>Home</button></a>
  </div>
  {% if posts %}
    {% for post in posts %}
      <div class="blog-post">
        <h3>{{ post.title }}</h3>
        <p class="post-meta">by {{ post.username }} on {{ post.timestamp }}</p>
        <p>{{ post.content }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No blog posts yet. Be the first to write one!</p>
  {% endif %}
{% endblock %}
